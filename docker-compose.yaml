services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ~/.kube:/root/.kube:ro  # Mount local kube config
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:8080"  # Serve React on port 3000
    depends_on:
      - backend
    restart: unless-stopped
